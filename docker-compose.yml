services:
  datamind:
    build: .
    expose:
      - "5000"
    environment:
      - AI_API_KEY=${AI_API_KEY}
      - AI_BASE_URL=${AI_BASE_URL:-https://api.deepseek.com/v1}
      - AI_MODEL=${AI_MODEL:-deepseek-chat}
      - FLASK_DEBUG=false
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-datamind-prod-secret}
    volumes:
      - ./datasets:/app/datasets
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static/videos:/usr/share/nginx/html/videos:ro
      # HTTPS 证书（可选，取消注释并放入 ssl/ 目录）
      # - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - datamind
    restart: unless-stopped
